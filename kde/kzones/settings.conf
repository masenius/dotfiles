# KZones [Script-kzones] scalar settings (non-layout).
# Layouts live in layouts.json. Applied by ../apply-kde.sh.
# Multi-value keys (e.g. filterList) use a literal \n as the item
# separator; apply-kde.sh/save-kde.sh translate to/from real newlines.
autoSnapAllNew=true
filterList=systemsettings\norg.kde.spectacle\norg.freedesktop.impl.portal.desktop.kde
filterMode=1
trackLayoutPerScreen=true
zoneOverlayHighlightTarget=1
zoneSelectorTriggerDistance=0
